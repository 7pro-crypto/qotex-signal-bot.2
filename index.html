<!doctype html><html><head><meta name=viewport content="width=device-width,initial-scale=1"><title>Qotex Live Signal</title><style>body{margin:0;background:#090b10;color:white;font:16px Arial;text-align:center}.w{max-width:520px;margin:auto;padding:18px}select,button{padding:13px;margin:4px;border-radius:10px;background:#151a23;color:white;border:1px solid #333}.circle{width:240px;height:240px;border-radius:50%;margin:30px auto 15px;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:bold;border:5px solid #555}.buy{border-color:#00e676}.sell{border-color:#ff5252}.wait{border-color:#ffd54f}.card{background:#11151d;padding:18px;border-radius:14px;margin:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.v{font-size:20px;font-weight:bold}.k{color:#9ca3af;font-size:12px}</style></head><body><div class=w><h2>QOTEX LIVE SIGNAL</h2><select id=s><option>EUR/USD</option><option>EUR/JPY</option><option>GBP/USD</option><option>USD/JPY</option><option>AUD/USD</option><option>USD/CAD</option><option>USD/CHF</option><option>NZD/USD</option></select><select id=i><option value=1min>1 MIN</option><option value=5min>5 MIN</option><option value=15min>15 MIN</option></select><br><button id=L>LIVE</button><button id=O>OTC</button><button onclick=load()>REFRESH</button><div id=c class="circle wait">WAIT</div><div id=count>Next update: 60s</div><div id=st>Connecting...</div><div class=card><div class=grid><div><div class=k>PRICE</div><div id=p class=v>--</div></div><div><div class=k>TREND</div><div id=t class=v>--</div></div><div><div class=k>RSI</div><div id=r class=v>--</div></div><div><div class=k>MACD</div><div id=m class=v>--</div></div></div></div><div class=card style="font-size:12px;color:#9ca3af">Signals are probabilistic, not guaranteed. OTC remains WAIT without a genuine Qotex-compatible OTC feed.</div></div><script>let otc=false,sec=60;const $=x=>document.getElementById(x);async function load(){if(otc){$("c").className="circle wait";$("c").textContent="WAIT";$("st").textContent="OTC feed not connected";return}$("st").textContent="Loading...";try{let d=await(await fetch("/api/candles?symbol="+encodeURIComponent($("s").value)+"&interval="+$("i").value)).json();if(d.error)throw Error(d.error);$("c").textContent=d.signal;$("c").className="circle "+d.signal.toLowerCase();$("p").textContent=Number(d.price).toFixed(5);$("t").textContent=d.trend;$("r").textContent=Number(d.rsi).toFixed(1);$("m").textContent=Number(d.macd).toFixed(6);$("st").textContent="Updated: "+d.time;sec=60}catch(e){$("c").textContent="WAIT";$("c").className="circle wait";$("st").textContent=e.message}}$("L").onclick=()=>{otc=false;load()};$("O").onclick=()=>{otc=true;load()};$("s").onchange=load;$("i").onchange=load;setInterval(()=>{sec--;if(sec<=0){sec=60;load()}$("count").textContent="Next update: "+sec+"s"},1000);load()</script></body></html>
